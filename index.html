<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Đà Nẵng</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        /* Nút định vị */
        .locate-button 
        {
            position: absolute; bottom: 100px; right: 10px; z-index: 500;
            background: white; padding: 10px; border-radius: 5px;
            cursor: pointer; box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            font-weight: bold; border: none;
        }
        .locate-button:hover { background: #f4f4f4; }

        /* Trang trí Popup */
        .info-popup { min-width: 120px; }
        .info-popup h3 { margin: 0 0 10px 0; color: #d35400; border-bottom: 2px solid #f39c12; }
        .info-popup table { width: 100%; border-collapse: collapse; }
        .info-popup td { padding: 5px 0; border-bottom: 1px solid #eee; font-size: 10px; }
        .info-popup td:first-child { font-weight: bold; color: #555; }

        /* CSS ĐỂ HIỆN CHỮ "CHỌN BẢN ĐỒ" */
        .leaflet-control-layers-toggle:after {
            content: "Chọn loại bản đồ"; 
            color: #333;
            font-weight: bold;
            font-size: 14px;
            padding-left: 30px; /* Đẩy chữ qua để không đè lên icon */
            line-height: 36px;
            white-space: nowrap;
        }
        .leaflet-control-layers-toggle {
            width: auto !important; /* Cho phép nút giãn rộng theo chữ */
            height: 36px !important;
            padding: 0 10px;
            background-position: 5px center !important; /* Đẩy icon sang trái */
            text-decoration: none;
            display: flex;
            align-items: center;
        }

    </style>
</head>
<body>
    <button class="locate-button" onclick="findMyState()">📍 Vị trí của tôi</button>
    <div id="map"></div>

    <script>

        // 1. Định nghĩa các loại nền Google Maps
        var googleHybrid = L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'], attribution: 'Google Hybrid'
        });

        var googleRoadmap = L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'], attribution: 'Google Roadmap'
        });

        var googleTerrain = L.tileLayer('http://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'], attribution: 'Google Terrain'
        });

        // 2. Khởi tạo bản đồ với nền mặc định là Hybrid
        var map = L.map('map', {
            center: [16.0544, 108.2022],
            zoom: 11,
            layers: [googleHybrid] // Nền mặc định
        });

        // 3. Tạo nút chọn chế độ bản đồ (Control Layers)
        var baseMaps = 
        {
            "Vệ tinh": googleHybrid,
            "Giao thông": googleRoadmap,
            "Địa hình": googleTerrain
        };
        L.control.layers(baseMaps).addTo(map);

        // 4. Hàm tính toán độ đậm nhạt dựa trên Zoom (Từ 15 về 0)
        function calculateOpacity(currentZoom) {
            let baseOpacity = 0.05; 
            if (currentZoom <= 15) {
                // Cứ giảm 1 độ zoom (từ 15 về 0) thì tăng 0.1
                let diff = 12 - currentZoom;
                return baseOpacity + (diff * 0.1);
            }
            return baseOpacity;
        }

        // 5. SỰ KIỆN THAY ĐỔI ĐỘ ĐẬM KHI PHÓNG TO/THU NHỎ
        map.on('zoomend', function() {
            if (geoJsonLayer) {
                let newOpacity = calculateOpacity(map.getZoom());
                geoJsonLayer.eachLayer(function(layer) {
                    layer.setStyle({ fillOpacity: newOpacity });
                });
            }
        });

        // 6. CHỨC NĂNG ĐỊNH VỊ NGƯỜI DÙNG
        function findMyState() {
            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ định vị!");
                return;
            }

            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                // Thêm marker tại vị trí người dùng
                var userMarker = L.marker([lat, lng]).addTo(map)
                    .bindPopup("<b>Bạn đang ở đây!</b>").openPopup();

                // Vẽ vòng tròn độ chính xác
                L.circle([lat, lng], { radius: position.coords.accuracy, color: 'blue', fillOpacity: 0.1 }).addTo(map);

                map.setView([lat, lng], 15);
            }, function() {
                alert("Không thể truy cập vị trí. Hãy kiểm tra cài đặt trình duyệt.");
            });
            }

            // 6. LOAD FILE map.json (Định dạng GeoJSON)
            let geoJsonLayer; // Khai báo biến để có thể dùng hàm resetStyle

            fetch('map.geojson') 
            .then(res => {
                if (!res.ok) throw new Error("Không tìm thấy file map.json");
                return res.json();
            })
            .then(data => {
                geoJsonLayer = L.geoJSON(data, {
                    // Thiết lập màu sắc mặc định cho các vùng
                    style: function(feature) {
                        return {
                           // fillColor: '#f1c40f', 
                            fillOpacity: 0.000001,
                            color: getRandomColor(),     
                            weight: 2
                        };
                    },
                    // Xử lý Popup và Hiệu ứng chuột cho từng vùng
                    onEachFeature: function(feature, layer) 
                    {
                        // --- PHẦN POPUP (Giữ nguyên của bạn) ---
                        if (feature.properties) 
                        {
                            const p = feature.properties;
                            let rows = "";
                            const labels = {
                                "ten_xa": "Tên phường/xã",
                                "loai": "Phân loại",
                                "dan_so": "Dân số",
                                "dtich_km2": "Diện tích (km²)",
                                "matdo_km2": "Mật độ"
                            };

                            for (let key in p) 
                            {
                                const keysToHide = ['name', 'styleUrl', 'styleHash', 'description', 
                                'stroke', 'fill', 'fill-opacity', 'stroke-opacity', 'stroke-width', 'Tên phường/xã',];

                                if (!keysToHide.includes(key)) 
                                {
                                    let displayLabel = labels[key] || key;
                                    rows += `<tr><td>${displayLabel}</td><td style="text-align:right">${p[key]}</td></tr>`;
                                }
                            }

                            let content = `
                                <div class="info-popup">
                                    <h3>${p.ten_xa || p.name || 'Thông tin'}</h3>
                                    <table>${rows}</table>
                                </div>`;
                            layer.bindPopup(content);
                        }

                        // --- PHẦN HIỆU ỨNG VIỀN SÁNG (THÊM MỚI) ---
                        layer.on({
                            mouseover: function(e) {
                                var l = e.target;
                                l.setStyle({
                                    weight: 5,          // Làm viền dày lên hẳn
                                    color: '#FF0000',   // Đổi viền thành màu đỏ sáng
                                    fillOpacity: 0.01    // Làm vùng đó hiện rõ hơn
                                });
                                l.bringToFront();       // Đưa vùng này lên trên cùng để viền không bị đè
                            },
                            mouseout: function(e) {
                                // Trả lại định dạng ban đầu khi di chuột ra
                                geoJsonLayer.resetStyle(e.target);
                            }
                        });
                    }
                }).addTo(map);
            })
            .catch(err => {
                console.error("Lỗi:", err);
                alert("Lỗi: Không thể load file map.json.");
            });
            function getRandomColor() {
    var letters = '0123456789ABCDEF';
    var color = '#';
    for (var i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
    }
    return color;
}

    </script>
</body>
</html>
