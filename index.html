<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Đường thủy Đà Nẵng</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; background: #aad3df; }
        .custom-popup { min-width: 200px; font-family: Arial, sans-serif; }
        .custom-popup h3 { margin: 0 0 10px 0; color: #d35400; border-bottom: 2px solid #f39c12; padding-bottom: 5px; }
        .custom-popup table { width: 100%; border-collapse: collapse; }
        .custom-popup td { padding: 5px 0; border-bottom: 1px solid #eee; font-size: 13px; color: #333; }
        .custom-popup td:first-child { font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-kml@1.0.0/L.KML.js"></script>

    <script>
        var map = L.map('map').setView([16.0544, 108.2022], 10);

        L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: 'Google Maps'
        }).addTo(map);

        fetch('Bandoduongthuy.kml')
            .then(res => res.text())
            .then(kmltext => {
                const parser = new DOMParser();
                const kml = parser.parseFromString(kmltext, 'text/xml');
                const track = new L.KML(kml);
                
                track.eachLayer(function(layer) {
                    // Lấy dữ liệu properties
                    let props = layer.feature ? layer.feature.properties : {};
                    
                    // Nếu properties trống, thử tìm trong ExtendedData thủ công
                    if (Object.keys(props).length <= 1) { 
                        // Lấy thẻ XML gốc của layer này
                        const xmlElement = layer._kmlEntity || (layer.feature ? layer.feature.originalFeature : null);
                        if (xmlElement) {
                             const dataTags = xmlElement.getElementsByTagName('Data');
                             for (let i = 0; i < dataTags.length; i++) {
                                 const name = dataTags[i].getAttribute('name');
                                 const value = dataTags[i].getElementsByTagName('value')[0]?.textContent;
                                 if (name && value) props[name] = value;
                             }
                        }
                    }

                    // Xây dựng bảng nội dung Popup
                    let tableRows = "";
                    const labels = {
                        "ten_xa": "Tên đơn vị",
                        "loai": "Phân loại",
                        "dtich_km2": "Diện tích (km²)",
                        "dan_so": "Dân số (người)",
                        "matdo_km2": "Mật độ dân số"
                    };

                    for (let key in props) {
                        if (!['name', 'styleUrl', 'styleHash', 'description', 'stroke', 'fill'].includes(key)) {
                            let labelName = labels[key] || key;
                            tableRows += `<tr><td>${labelName}</td><td style="text-align:right">${props[key]}</td></tr>`;
                        }
                    }

                    const popupHtml = `
                        <div class="custom-popup">
                            <h3>${props.name || props.ten_xa || "Thông tin"}</h3>
                            <table>${tableRows || "<tr><td>Không có dữ liệu chi tiết</td></tr>"}</table>
                        </div>
                    `;
                    
                    layer.bindPopup(popupHtml);
                    
                    layer.setStyle({
                        fillColor: '#f1c40f',
                        fillOpacity: 0.3,
                        color: '#2980b9',
                        weight: 1
                    });
                });

                map.addLayer(track);
                const bounds = track.getBounds();
                if (bounds.isValid()) map.fitBounds(bounds);
            })
            .catch(e => console.error("Lỗi nạp file:", e));
    </script>
</body>
</html>
